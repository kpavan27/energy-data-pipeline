name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches upstream URLs disappearing or dependency breakage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Unit and end-to-end tests (synthetic fixtures)
        run: pytest

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Ingest pinned releases, dbt build with data tests, regenerate reports
        run: energy-pipeline run
      - name: Committed results are reproducible
        run: git diff --exit-code -- reports/metrics.json reports/revision_summary.csv reports/manifest.json
